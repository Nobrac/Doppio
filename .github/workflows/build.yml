# Builds everything with MSVC and runs the portable tests on every push.
# The Windows job is the first place the MSVC build (with /W4 /sdl /guard:cf)
# actually runs; nothing here loads the DLLs into LogonUI or lsass.
name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build (build.bat)
        shell: cmd
        run: build.bat

      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          if ($bad) { throw "$bad PowerShell parse error(s)" }

      # The installers run in Windows PowerShell 5.1 with
      # ErrorActionPreference 'Stop'. There, 2>&1 on reg.exe turned its
      # success message on stderr into a terminating error, right after a
      # good import. Run the helper the installer uses, in 5.1, both ways.
      - name: reg import helper in Windows PowerShell 5.1
        shell: powershell
        # GitHub's powershell shell ends a step with `exit $LASTEXITCODE`, so
        # the step ends with an explicit exit: the last reg.exe call here is
        # the one that is supposed to fail. ::error:: and ::notice:: lines
        # show up as annotations on the run.
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $tokens = $null; $errors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\install-doppio.ps1).Path, [ref]$tokens, [ref]$errors)
            $fn = $ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Invoke-RegImport' }, $true) | Select-Object -First 1
            if (-not $fn) { throw 'Invoke-RegImport not found in install-doppio.ps1' }
            . ([scriptblock]::Create($fn.Extent.Text))

            $reg = Join-Path $env:RUNNER_TEMP 'doppio-ci.reg'
            $text = "Windows Registry Editor Version 5.00`r`n`r`n[HKEY_CURRENT_USER\Software\DoppioCiTest]`r`n`"x`"=`"1`"`r`n"
            Set-Content -LiteralPath $reg -Value $text -Encoding Unicode
            Invoke-RegImport -Path $reg
            if (-not (Test-Path 'HKCU:\Software\DoppioCiTest')) { throw 'the good import did not create the key' }
            Remove-Item 'HKCU:\Software\DoppioCiTest' -Recurse

            $threw = $false
            try { Invoke-RegImport -Path (Join-Path $env:RUNNER_TEMP 'does-not-exist.reg') } catch { $threw = $true }
            if (-not $threw) { throw 'a failed import did not throw' }
          } catch {
            Write-Host "::error::reg import helper: $($_.Exception.Message)"
            exit 1
          }
          Write-Host '::notice::Invoke-RegImport in Windows PowerShell 5.1: a good import passes, a failed one throws.'
          exit 0

      - name: Check that every binary has Control Flow Guard
        shell: pwsh
        run: |
          foreach ($f in 'TacProvider.dll', 'enroll.exe', 'TacAuthPackage.dll', 'TacSubAuth.dll') {
            $h = dumpbin /headers $f | Out-String
            if ($h -notmatch 'Control Flow Guard') { throw "$f was built without Control Flow Guard" }
            Write-Host "$f : CFG on"
          }

      - name: Static analysis (/analyze, report only)
        shell: cmd
        run: >
          cl /nologo /c /analyze /W4 /EHsc /std:c++17 /DUNICODE /D_UNICODE
          dll.cpp CTacProvider.cpp CTacCredential.cpp CTacFilter.cpp helpers.cpp
          totp.cpp store.cpp store_index.cpp verify.cpp statelock.cpp eventlog.cpp
          enroll.cpp ap.cpp subauth.cpp

      # The code that runs inside lsass gets no free pass: a finding there fails
      # the build. SDK headers are excluded from the analysis, so only our own
      # code can trip it.
      - name: Static analysis of the lsass code (/analyze /WX)
        shell: cmd
        run: >
          cl /nologo /c /analyze /analyze:external- /external:anglebrackets /external:W0
          /W4 /WX /EHsc /std:c++17 /DUNICODE /D_UNICODE
          ap.cpp subauth.cpp store_index.cpp

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Native C++ tests (totp/verify, and the lsass code under ASan/UBSan)
        run: make -C tests/native
      - name: Python RFC 6238 check
        run: python3 tests/totp_check.py
